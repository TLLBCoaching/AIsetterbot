  <style>
:root {
  --bg: #f6f7f5;
  --card: #ffffff;
  --text: #17201a;
  --muted: #66706a;
  --line: #e3e6e2;
  --accent: #15803d;
  --accent-soft: #e5f4ea;
  --warn: #b45309;
  --warn-soft: #fdf1e2;
  --bad: #b91c1c;
  --bad-soft: #fde8e8;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411;
    --card: #182019;
    --text: #e7ece8;
    --muted: #94a098;
    --line: #2a332c;
    --accent: #4ade80;
    --accent-soft: #1a3323;
    --warn: #fbbf24;
    --warn-soft: #362a12;
    --bad: #f87171;
    --bad-soft: #3a1a1a;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --card: #182019; --text: #e7ece8; --muted: #94a098; --line: #2a332c;
  --accent: #4ade80; --accent-soft: #1a3323; --warn: #fbbf24; --warn-soft: #362a12;
  --bad: #f87171; --bad-soft: #3a1a1a; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.icon-btn { border: 0; background: none; font-size: 22px; padding: 4px 8px; cursor: pointer; color: var(--muted); }

.view { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 90px); }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  position: relative; border: 0; background: none; padding: 8px 0 7px; font-size: 11px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
}
.tabs button.active { color: var(--accent); font-weight: 600; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card h2 .count { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.error { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.list > li:first-child { border-top: 0; padding-top: 2px; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 550; overflow-wrap: anywhere; }
.list .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 52px; }
.clickable { cursor: pointer; }

.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: none;
  flex: none; cursor: pointer; margin-top: 1px; padding: 0;
}
.check.done { background: var(--accent); border-color: var(--accent); }
.done-text { text-decoration: line-through; color: var(--muted); }

input[type=text], input[type=password], input[type=number], input[type=date], textarea, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
}
textarea { resize: vertical; min-height: 90px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; }
.stack > * + * { margin-top: 8px; }

button.primary, button.secondary, button.ghost {
  border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; border: 1px solid transparent;
}
button.primary { background: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary { color: #06210f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #06210f; } }
button.secondary { background: var(--accent-soft); color: var(--accent); }
button.ghost { background: none; border-color: var(--line); color: var(--muted); }
button:disabled { opacity: .55; cursor: default; }
.link-btn { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; }

.segmented { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.segmented button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
.segmented button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.day-head { font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
.day-head:first-child { margin-top: 0; }

.thread { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.them { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
.bubble.you { align-self: flex-end; background: var(--accent-soft); }
.bubble .at { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

.chat { display: flex; flex-direction: column; gap: 8px; }
.chat .bubble.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
.chat .bubble.user { align-self: flex-end; background: var(--accent-soft); }
.chat-input { position: sticky; bottom: calc(env(safe-area-inset-bottom) + 64px); background: var(--bg); padding-top: 10px; }
.chat-input textarea { min-height: 52px; }
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.suggestions button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer; }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin-top: 6px; }
.bars .bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.bars .bar.partial { opacity: .4; }
.bar-labels { display: flex; gap: 4px; font-size: 10px; color: var(--muted); margin-top: 4px; }
.bar-labels span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }

.amount { font-variant-numeric: tabular-nums; white-space: nowrap; }
.amount.in { color: var(--accent); }
.amount.out { color: var(--bad); }

.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
.brand { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 76px);
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; z-index: 10;
  max-width: calc(100% - 32px);
}
.spinner { color: var(--muted); font-size: 14px; padding: 8px 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }

/* ---- icons ---- */
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon.sm { width: 16px; height: 16px; vertical-align: -3px; }
.icon.star { fill: var(--warn); stroke: var(--warn); margin-right: 4px; }
.icon.muted { color: var(--muted); }
.tabs button.active .icon { stroke-width: 2.2; }
.badge {
  position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px;
  border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
}
#refresh { display: grid; place-items: center; }
#refresh.spin .icon { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- pull to refresh ---- */
.ptr { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height .15s; }
.ptr.ready span::after { content: " · release"; }

/* ---- loading skeleton ---- */
.skeleton .sk-line { height: 12px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---- today ---- */
.greeting { margin: 0 0 12px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.greeting span { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
.hero { padding: 16px; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.hero-event { padding-bottom: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.eyebrow.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.hero-title { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
.countdown { color: var(--text); font-weight: 600; }
.hero-todos .eyebrow { color: var(--muted); }
.quick-add { margin-top: 10px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat-chip {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
}
.stat-chip strong { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stat-chip span { font-size: 12px; color: var(--muted); }
.stat-chip:active { transform: scale(.97); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---- chips ---- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips { position: relative; }
input.visually-hidden { position: absolute; left: 0; bottom: 0; width: 1px !important; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none; }
.editor .row > * { flex: 0 0 auto; }

/* ---- to-dos ---- */
.list > li.todo { display: block; padding: 0; }
.list > li.todo + li.todo { border-top: 1px solid var(--line); }
.swipe { position: relative; overflow: hidden; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; gap: 4px; padding-left: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; border-radius: 10px; }
.swipe-fg { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; background: var(--card); touch-action: pan-y; }
.check { display: grid; place-items: center; color: #fff; }
.todo-body { all: unset; flex: 1; min-width: 0; cursor: pointer; display: block; }
.todo-body:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.todo-body .title, .todo-body .meta { display: block; }
.editor { padding: 2px 0 12px 32px; }
.hint { margin: -4px 0 10px; }
button.ghost.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }

/* ---- clients ---- */
.pill.subtle { background: var(--line); color: var(--muted); }
.meta.right { text-align: right; white-space: nowrap; }
.thread-head { align-items: center; justify-content: space-between; margin-bottom: 10px; }
.composer textarea.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { border-color: var(--accent); } }
button.send { width: 100%; padding: 13px 14px; font-size: 16px; }

/* ---- money ---- */
.stats.three { grid-template-columns: repeat(3, 1fr); }
.stats.three .value { font-size: 18px; }
.up { color: var(--accent); font-weight: 600; }
.down { color: var(--bad); font-weight: 600; }
.chart { margin-top: 14px; }
.chart-readout { font-size: 14px; color: var(--muted); margin-bottom: 6px; min-height: 22px; }
.chart-readout strong { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.chart-body { display: flex; gap: 6px; }
.axis { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--muted); text-align: right; height: 120px; padding: 0 0 0; min-width: 44px; font-variant-numeric: tabular-nums; }
.axis span:nth-child(2) { transform: translateY(0); }
.chart-plot { position: relative; flex: 1; height: 120px; }
.gridlines { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.gridlines i { border-top: 1px dashed var(--line); }
.chart-plot .bars { position: absolute; inset: 0; height: auto; margin: 0; }
.bars button.bar { border: 0; padding: 0; cursor: pointer; flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .55; }
.bars button.bar.partial { opacity: .3; }
.bars button.bar.sel { opacity: 1; }
.chart .bar-labels { margin-left: 50px; }

/* ---- ask ---- */
.chat .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.dots { width: 18px; height: 6px; background: radial-gradient(circle, var(--muted) 2.5px, transparent 3px) 0 0 / 6px 6px repeat-x; animation: dots 1s steps(3) infinite; }
@keyframes dots { from { width: 6px; } to { width: 24px; } }
.chat-input { align-items: flex-end; flex-wrap: nowrap; }
.chat-input textarea { min-height: 44px; resize: none; }
.icon-btn.mic { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); display: grid; place-items: center; }
.icon-btn.mic.on { color: #fff; background: var(--bad); border-color: var(--bad); animation: blink 1.2s infinite; }
.chat .suggestions { margin-top: 4px; }

/* ---- toast ---- */
.toast { display: flex; align-items: center; gap: 14px; }
.toast-undo { border: 0; background: none; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 0; }
.day-head.now { color: var(--accent); }

.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center;padding:6px 16px;}
</style>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand">HQ</div>
      <p class="muted">Your day, clients and money in one place.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="primary">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <div class="demo-banner">Demo with made-up data. Nothing here is real or sent anywhere.</div>
    <div id="ptr" class="ptr" aria-hidden="true"><span>↓ Pull to refresh</span></div>
    <header class="topbar">
      <h1 id="view-title">Today</h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh"></button>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="calendar">Calendar</button>
      <button data-tab="todos">To-dos</button>
      <button data-tab="clients">Clients<span id="clients-badge" class="badge" hidden></span></button>
      <button data-tab="money">Money</button>
      <button data-tab="ask">Ask</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script>
// Demo mode: answers the app's API calls in the browser with made-up data. Nothing leaves this page.
(function () {
  // Embedded viewers can block confirm() (it returns false instantly) and pushState; keep the demo usable there.
  const nativeConfirm = window.confirm.bind(window);
  window.confirm = (msg) => { const t = Date.now(); let ok = false; try { ok = nativeConfirm(msg); } catch (e) {} return ok || Date.now() - t < 30; };
  const nativePush = history.pushState.bind(history);
  history.pushState = (...args) => { try { nativePush(...args); } catch (e) {} };
  const TZ = "Australia/Sydney";
  const day = (n = 0) => { const d = new Date(Date.now() + n * 86400000); return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d); };
  const off = (() => { const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "longOffset" }).formatToParts(new Date()).find((x) => x.type === "timeZoneName").value; return p.replace("GMT", "") || "+00:00"; })();
  const at = (n, hm) => `${day(n)}T${hm}:00${off}`;
  const ago = (mins) => new Date(Date.now() - mins * 60000).toISOString();

  const events = [];
  for (let i = 0; i < 14; i++) events.push({ title: "Morning training", start: at(i, "06:00"), end: at(i, "07:00"), all_day: false, location: "" });
  // A call 40 minutes from now, so the "Up next" card always has something to show in the demo.
  const hm = (ms) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ms));
  const soon = Date.now() + 40 * 60000;
  if (hm(soon) > hm(Date.now())) events.push({ title: "Sales call – Mark", start: at(0, hm(soon)), end: at(0, hm(soon + 45 * 60000) > hm(soon) ? hm(soon + 45 * 60000) : "23:59"), all_day: false, location: "Zoom" });
  events.push({ title: "Client check-ins", start: at(0, "15:00"), end: at(0, "16:30"), all_day: false, location: "" });
  events.push({ title: "Content shoot", start: at(1, "14:00"), end: at(1, "16:00"), all_day: false, location: "Studio" });
  events.push({ title: "Team meeting", start: at(3, "09:00"), end: at(3, "09:45"), all_day: false, location: "Google Meet" });
  events.push({ title: "School holidays", start: at(0, "00:00"), end: at(1, "00:00"), all_day: true, location: "" });

  let nextId = 10;
  let todos = [

<script>
"use strict";

// ---------- helpers ----------

const $ = (sel) => document.querySelector(sel);
const view = $("#view");
let me = { currency: "AUD", timezone: "Australia/Sydney", connected: {} };

// Builds DOM nodes. Text is always set as text, never as HTML, because inbox content comes from other people.
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// Line icons (24px grid, stroke-based).
const ICONS = {
  today: ["M12 3v2", "M12 19v2", "M5.6 5.6l1.4 1.4", "M17 17l1.4 1.4", "M3 12h2", "M19 12h2", "M5.6 18.4L7 17", "M17 7l1.4-1.4", "M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z"],
  calendar: ["M4 6h16v14H4z", "M4 10h16", "M8 3v4", "M16 3v4"],
  todos: ["M4 6h2", "M4 12h2", "M4 18h2", "M9 6h11", "M9 12h11", "M9 18h11"],
  clients: ["M4 5h16v11H8l-4 4z"],
  money: ["M3 7h18v10H3z", "M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z", "M6 12h.01", "M18 12h.01"],
  ask: ["M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z", "M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"],
  refresh: ["M20 11a8 8 0 1 0-2.3 5.7", "M20 4v7h-7"],
  star: ["M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"],
  mic: ["M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z", "M5 11a7 7 0 0 0 14 0", "M12 18v3"],
  check: ["M5 12.5l4.5 4.5L19 7.5"],
  chevron: ["M9 6l6 6-6 6"],
};
function icon(name, cls = "icon") {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", cls);
  svg.setAttribute("aria-hidden", "true");
  for (const d of ICONS[name] || []) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  return svg;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  if (res.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please log in"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

function toast(msg, undo) {
  const t = $("#toast");
  t.replaceChildren(h("span", {}, msg));
  if (undo) t.append(h("button", { class: "toast-undo", onclick: () => { t.hidden = true; undo(); } }, "Undo"));
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.hidden = true), undo ? 5000 : 2800);
}

const money = (n) => (n === null || n === undefined) ? "—" :
  new Intl.NumberFormat("en-AU", { style: "currency", currency: me.currency, maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 }).format(n);

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: me.timezone }).format(new Date());
}
function addDays(iso, n) {
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function nextMonday(iso) {
  const dow = new Date(iso + "T12:00:00Z").getUTCDay(); // 0 = Sunday
  return addDays(iso, ((8 - dow) % 7) || 7);
}
function dayLabel(iso) {
  const t = todayISO();
  if (iso === t) return "Today";
  if (iso === addDays(t, 1)) return "Tomorrow";
  if (iso === addDays(t, -1)) return "Yesterday";
  return new Date(iso + "T12:00:00Z").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
}
// Event times come back already in the HQ timezone with an offset; show the wall-clock part as-is.
const clock = (isoDateTime) => {
  const [hh, mm] = isoDateTime.slice(11, 16).split(":").map(Number);
  const ampm = hh >= 12 ? "pm" : "am";
  return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")}${ampm}`;
};
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function untilText(ms) {
  const mins = Math.round(ms / 60000);
  if (mins <= 0) return "now";
  if (mins < 60) return `in ${mins} min`;
  const hrs = Math.floor(mins / 60), rest = mins % 60;
  return rest ? `in ${hrs}h ${rest}m` : `in ${hrs}h`;
}
const notConnected = (what, how) => h("div", { class: "empty" }, `${what} isn't connected yet. ${how}`);
const errorBox = (e) => h("div", { class: "error small" }, e.message || String(e));
const skeleton = () => [1, 2, 3].map((n) => h("div", { class: "card skeleton" },
  h("div", { class: "sk-line", style: "width:35%" }), h("div", { class: "sk-line" }), h("div", { class: "sk-line", style: `width:${50 + n * 10}%` })));
const isClientTag = (tags) => (tags || []).some((t) => /client/i.test(t));

// ---------- data cache ----------
// Screens show what they last loaded straight away, then refresh quietly in the background.

const cache = new Map();
function loader(useCache) {
  const state = { usedCache: false };
  state.load = async (path) => {
    if (useCache && cache.has(path)) { state.usedCache = true; return cache.get(path); }
    const data = await api(path);
    cache.set(path, data);
    if (path === "/api/today") setBadge((data.unread.conversations || []).length);
    if (path === "/api/inbox?unread=false") setBadge(data.conversations.filter((c) => c.unread).length);
    return data;
  };
  return state;
}

function setBadge(n) {
  const b = $("#clients-badge");
  b.textContent = n > 9 ? "9+" : String(n);
  b.hidden = !n;
}

// ---------- shared pieces ----------

function eventList(events) {
  if (!events.length) return h("div", { class: "empty" }, "Nothing scheduled.");
  return h("ul", { class: "list" }, events.map((e) => h("li", {},
    h("div", { class: "time" }, e.all_day ? "All day" : clock(e.start)),
    h("div", { class: "grow" },
      h("div", { class: "title" }, e.title),
      (e.location || !e.all_day) ? h("div", { class: "meta" },
        [!e.all_day ? `until ${clock(e.end)}` : "", e.location].filter(Boolean).join(" · ")) : null,
    ),
  )));
}

// Quick date choice: Today / Tomorrow / Next week / Someday, or pick a date.
function datePicker(initial, onChange) {
  let value = initial || null;
  const iso = todayISO();
  const options = [["Today", iso], ["Tomorrow", addDays(iso, 1)], ["Next week", nextMonday(iso)], ["Someday", null]];
  const native = h("input", { type: "date", class: "visually-hidden", tabindex: "-1", "aria-hidden": "true" });
  const wrap = h("div", { class: "chips", role: "group", "aria-label": "Due date" });

    const picked = value && !options.some(([, v]) => v === value);
    wrap.replaceChildren(
      ...options.map(([label, v]) => h("button", {
        type: "button", class: "chip" + (value === v ? " on" : ""), "aria-pressed": value === v ? "true" : "false",
        onclick: () => { value = v; paint(); onChange && onChange(value); },
      }, label)),
      h("button", {
        type: "button", class: "chip" + (picked ? " on" : ""),
        onclick: () => { native.value = value || iso; native.showPicker ? native.showPicker() : native.click(); },
      }, picked ? dayLabel(value) : "Pick…"),
      native,
    );
  }
  native.addEventListener("change", () => { if (native.value) { value = native.value; paint(); onChange && onChange(value); } });
  paint();
  return { el: wrap, get: () => value };
}

const ASANA = (t) => t.url && t.url.startsWith("https://app.asana.com/");

async function patchTodo(t, body, after) {
  await api(`/api/todos/${t.id}`, { method: "PATCH", body });

}

async function completeTodo(t, after) {
  await patchTodo(t, { done: true }, after);

}

function todoEditor(t, after) {

function enableSwipe(el, onDone) {
  let x0 = null, y0 = 0, dx = 0, dragging = false;
  el.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; x0 = e.clientX; y0 = e.clientY; dx = 0; dragging = false; });
  el.addEventListener("pointermove", (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    const dy = e.clientY - y0;
    if (!dragging && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) { dragging = true; el.setPointerCapture(e.pointerId); }
    if (dragging) el.style.transform = `translateX(${Math.max(0, Math.min(dx, 140))}px)`;
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    el.style.transition = "transform .18s ease";
    el.style.transform = dragging && dx > 90 ? "translateX(100%)" : "";
    setTimeout(() => (el.style.transition = ""), 200);
    if (dragging && dx > 90) setTimeout(onDone, 160);
    if (dragging) el.addEventListener("click", (ev) => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function upNext(events) {
  const now = Date.now();
  const timed = events.filter((e) => !e.all_day && Date.parse(e.end) > now).sort((a, b) => Date.parse(a.start) - Date.parse(b.start));
  const e = timed[0];
  if (!e) return h("div", { class: "hero-event" }, h("div", { class: "eyebrow" }, "Up next"), h("div", { class: "hero-title" }, "Nothing else today"), h("div", { class: "meta" }, "Your calendar is clear."));
  const live = Date.parse(e.start) <= now;
  const when = h("span", { class: "countdown", "data-start": e.start, "data-end": e.end });
  updateCountdown(when);
  return h("div", { class: "hero-event" },
    h("div", { class: "eyebrow" + (live ? " live" : "") }, live ? "Happening now" : "Up next"),
    h("div", { class: "hero-title" }, e.title),
    h("div", { class: "meta" }, `${clock(e.start)}–${clock(e.end)}`, " · ", when, e.location ? ` · ${e.location}` : ""),
  );
}

function updateCountdown(el) {
  const start = Date.parse(el.dataset.start), end = Date.parse(el.dataset.end), now = Date.now();
  el.textContent = start <= now ? `until ${clock(el.dataset.end)} (${untilText(end - now).replace("in ", "")} left)` : untilText(start - now);
}

views.calendar = async (_arg, { load }) => {
  calStart = calStart || todayISO();

  if (!d.configured) return h("div", { class: "card" }, notConnected("Your calendar", "Add one or more private iCal links to HQ_CALENDAR_ICS_URLS."));
  const byDay = {};
  for (let i = 0; i < days; i++) byDay[addDays(calStart, i)] = [];
  for (const e of d.events) {
    // Multi-day and all-day events show on every day they cover.
    for (let i = 0; i < days; i++) {
      const day = addDays(calStart, i);
      const endDay = e.end.slice(0, 10);
      if (e.start.slice(0, 10) <= day && (endDay > day || (endDay === day && !e.all_day) || e.start.slice(0, 10) === day)) byDay[day].push(e);
    }
  }
  return [
    h("div", { class: "segmented" },
      h("button", { onclick: () => { calStart = addDays(calStart, -7); render(); } }, "← Prev"),
      h("button", { class: calStart === todayISO() ? "active" : "", onclick: () => { calStart = todayISO(); render(); } }, "This week"),

async function threadView(id, load) {
  const c = await load(`/api/inbox/${encodeURIComponent(id)}`);
  $("#view-title").textContent = c.name;
  const box = h("textarea", { placeholder: c.send_type ? `Reply on ${c.channel}…` : "", value: c.draft ? c.draft.text : "", rows: 3 });
  const instructions = h("input", { type: "text", placeholder: "Or tell Claude what to say…" });
  let draftId = c.draft ? c.draft.id : null;

  async function draft(text) {
    if (text !== undefined) instructions.value = text;
    draftBtn.disabled = true; draftBtn.textContent = "Drafting…";
    box.classList.add("pulse");
    try {
      const dr = await api(`/api/inbox/${encodeURIComponent(id)}/draft`, { method: "POST", body: { instructions: instructions.value } });
      box.value = dr.text; draftId = dr.id;
    } catch (e) { toast(e.message); }
    box.classList.remove("pulse");
    draftBtn.disabled = false; draftBtn.textContent = "✦ Draft";
  }
  const draftBtn = h("button", { class: "secondary", type: "button", style: "flex:0 0 auto", onclick: () => draft() }, "✦ Draft");

  const sendBtn = h("button", {
    class: "primary send", type: "button",

      const text = box.value.trim();
      if (!text) { toast("Write or draft a reply first"); return; }
      if (!confirm(`Send this to ${c.name} on ${c.channel}?\n\n${text}`)) return;
      sendBtn.disabled = true;
      try {
        await api(`/api/inbox/${encodeURIComponent(id)}/send`, { method: "POST", body: { text, draft_id: draftId } });
        toast("Sent");
        render({ fresh: true });
      } catch (e) { toast(e.message); sendBtn.disabled = false; }
    },
  }, `Send on ${c.channel}`);

  const thread = h("div", { class: "thread" }, c.messages.length ? c.messages.map((m) =>
    h("div", { class: `bubble ${m.from}` }, m.text, h("span", { class: "at" }, ago(m.at)))) : h("div", { class: "empty" }, "No messages."));
  setTimeout(() => thread.lastElementChild && thread.lastElementChild.scrollIntoView({ block: "nearest" }), 0);

  return [
    h("div", { class: "row thread-head" },
      h("button", { class: "link-btn", style: "flex:0 0 auto", onclick: () => go("clients") }, "← All"),
      h("span", { class: "muted small", style: "text-align:right" },

function weeklyChart(weeks) {
  const max = Math.max(1, ...weeks.map((w) => w.amount));
  const readout = h("div", { class: "chart-readout" });
  const bars = h("div", { class: "bars", role: "group", "aria-label": "Cash collected per week" });
  const select = (i) => {
    const w = weeks[i];
    readout.replaceChildren(h("strong", {}, money(w.amount)), h("span", {}, ` week of ${dayLabel(w.week_of)}${i === weeks.length - 1 ? " (so far)" : ""}`));
    bars.querySelectorAll(".bar").forEach((b, j) => b.classList.toggle("sel", j === i));
  };
  weeks.forEach((w, i) => bars.append(h("button", {
    class: "bar" + (i === weeks.length - 1 ? " partial" : ""), style: `height:${Math.max(2, (w.amount / max) * 100)}%`,
    "aria-label": `Week of ${w.week_of}: ${money(w.amount)}`, onclick: () => select(i),
  })));
  select(weeks.length - 1);
  return h("div", { class: "chart" },
    readout,
    h("div", { class: "chart-body" },
      h("div", { class: "axis" }, h("span", {}, money(max)), h("span", {}, money(max / 2)), h("span", {}, "$0")),
      h("div", { class: "chart-plot" }, h("div", { class: "gridlines" }, h("i"), h("i"), h("i")), bars)),
    h("div", { class: "bar-labels" }, weeks.map((w, i) => h("span", {}, (weeks.length - 1 - i) % 2 ? "" : `${Number(w.week_of.slice(8, 10))}/${Number(w.week_of.slice(5, 7))}`))),
    h("div", { class: "muted small", style: "margin-top:6px" }, "Tap a bar for its total. Net of refunds; the latest week is partial."),
  );
}

function versus(now, before) {
  if (!before) return "";
  const pct = Math.round(((now - before) / before) * 100);
  return `${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct)}%`;
}

          const value = Math.abs(parseFloat(amount.value)) * (kind.value === "out" ? -1 : 1);
          await api("/api/money", { method: "POST", body: { amount: value, category: category.value || "other", note: note.value } });
          toast("Logged");
          render({ fresh: true });
        },
      }, h("div", { class: "row" }, amount, kind), h("div", { class: "row" }, category, note), cats, h("button", { class: "primary", type: "submit" }, "Log it")),
    ),
    log.recent.length ? h("div", { class: "card" }, h("h2", {}, "Recent entries"),
      h("ul", { class: "list" }, log.recent.map((e) => h("li", {},
        h("div", { class: "grow" }, h("div", { class: "title" }, e.category), h("div", { class: "meta" }, `${dayLabel(e.date)}${e.note ? " · " + e.note : ""}`)),
        h("div", { class: "amount " + (e.amount < 0 ? "out" : "in") }, money(e.amount)),
        h("button", { class: "icon-btn small", "aria-label": "Delete", onclick: async () => { if (confirm("Delete this entry?")) { await api(`/api/money/${e.id}`, { method: "DELETE" }); render({ fresh: true }); } } }, "×"))))) : null,
  ];
};

// Reads the assistant's reply as it's written: one JSON event per line.
async function streamChat(message, onEvent) {
  const res = await fetch("/api/chat/stream", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message }), credentials: "same-origin",
  });
  if (res.status === 401) { showLogin(); throw new Error("Please log in"); }
  if (!res.ok || !res.body) throw new Error(`Request failed (${res.status})`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
}

const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

views.ask = async (_arg, { load }) => {
  const d = await load("/api/chat");
  const thread = h("div", { class: "chat" }, d.messages.map((m) => h("div", { class: `bubble ${m.role}` }, m.text)));
  const input = h("textarea", { placeholder: "Ask or tell me what to do…", rows: 1 });
  const send = h("button", { class: "primary", type: "submit", style: "flex:0 0 auto" }, "Send");
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) { e.preventDefault(); ask(input.value); } });

  async function ask(text) {
    if (!text.trim() || send.disabled) return;
    thread.querySelector(".suggestions")?.remove();
    thread.append(h("div", { class: "bubble user" }, text));
    const reply = h("div", { class: "bubble assistant" });
    const body = h("span", {});
    const status = h("span", { class: "status" }, h("i", { class: "dots" }), "Thinking…");
    reply.append(body, status);
    thread.append(reply);
    reply.scrollIntoView({ behavior: "smooth", block: "end" });
    input.value = ""; input.style.height = ""; send.disabled = true;
    const used = new Set();
    try {
      await streamChat(text, (ev) => {
        if (ev.type === "text") { body.textContent += ev.delta; status.hidden = true; }
        else if (ev.type === "status") { status.hidden = false; status.replaceChildren(h("i", { class: "dots" }), ev.text); }
        else if (ev.type === "done") (ev.tools || []).forEach((t) => used.add(t));
        reply.scrollIntoView({ block: "end" });
      });
      status.remove();
      if (!body.textContent.trim()) body.textContent = "(no reply)";
      if (used.size) reply.append(h("span", { class: "at" }, `used: ${[...used].join(", ").replaceAll("_", " ")}`));
      cache.delete("/api/chat");
      ["/api/today", "/api/todos?include_done=false", "/api/finance"].forEach((p) => cache.delete(p)); // it may have changed things
    } catch (e) {
      status.remove();
      reply.classList.add("error");
      body.textContent = e.message;
    }
    send.disabled = false;
  }

  const suggestions = ["What's my day look like?", "Who do I need to reply to?", "How's revenue this month?", "Plan my week"];
  let mic = null;
  if (Speech) {
    mic = h("button", { type: "button", class: "icon-btn mic", "aria-label": "Speak", style: "flex:0 0 auto" }, icon("mic"));
    mic.addEventListener("click", () => {
      const rec = new Speech();
      rec.lang = "en-AU";
      rec.interimResults = true;
      mic.classList.add("on");
      rec.onresult = (e) => { input.value = [...e.results].map((r) => r[0].transcript).join(""); };
      rec.onend = () => { mic.classList.remove("on"); input.focus(); };
      rec.onerror = () => { mic.classList.remove("on"); toast("Couldn't hear that"); };
      rec.start();
    });
  }
  if (!d.messages.length) thread.append(h("div", { class: "suggestions" }, suggestions.map((s) => h("button", { onclick: () => ask(s) }, s))));
  return [
    h("div", { class: "row", style: "justify-content:flex-end;margin-bottom:8px" },
      h("button", { class: "ghost", style: "flex:0 0 auto", onclick: async () => { await api("/api/chat/new", { method: "POST" }); cache.delete("/api/chat"); render({ fresh: true }); } }, "New chat")),
    thread,
    h("form", { class: "chat-input row", onsubmit: (ev) => { ev.preventDefault(); ask(input.value); } }, mic, input, send),
  ];
};

// ---------- routing ----------

const titles = { today: "Today", calendar: "Calendar", todos: "To-dos", clients: "Clients", money: "Money", ask: "Ask" };
let current = { tab: "today", arg: null };
let renderSeq = 0;

function go(tab, arg = null) {
  current = { tab, arg };
  const hash = arg ? `#${tab}/${encodeURIComponent(arg)}` : `#${tab}`;
  if (location.hash !== hash) history.pushState(null, "", hash);
  window.scrollTo(0, 0);
  render();
}

const busyTyping = () => {
  const a = document.activeElement;
  return a && view.contains(a) && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.value)) || view.querySelector(".editor");
};

// Shows cached data first (if any), then quietly swaps in fresh data, unless you're mid-edit.
async function render({ fresh = false } = {}) {
  const { tab, arg } = current;
  const seq = ++renderSeq;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  $("#view-title").textContent = titles[tab];
  const stillHere = () => seq === renderSeq;

  if (!fresh) {
    const cached = loader(true);
    let content = null;
    const timer = setTimeout(() => stillHere() && !content && view.replaceChildren(...skeleton()), 120);
    try {
      content = await views[tab](arg, cached);
    } catch (e) {
      clearTimeout(timer);
      if (stillHere()) view.replaceChildren(h("div", { class: "card" }, errorBox(e)));
      return;
    }
    clearTimeout(timer);
    if (!stillHere()) return;
    view.replaceChildren(...[content].flat(3).filter(Boolean));
    if (!cached.usedCache) return; // that was already fresh
  }
  setRefreshing(true);
  try {
    const content = await views[tab](arg, loader(false));
    if (stillHere() && !(busyTyping() && !fresh)) view.replaceChildren(...[content].flat(3).filter(Boolean));
  } catch (e) {
    if (stillHere() && fresh) toast(e.message);
  } finally {
    if (stillHere()) setRefreshing(false);
  }
}

function setRefreshing(on) { $("#refresh").classList.toggle("spin", on); }

function fromHash() {
  const [tab, arg] = location.hash.slice(1).split("/");
  current = { tab: titles[tab] ? tab : "today", arg: arg ? decodeURIComponent(arg) : null };
}

// Pull down at the top of the page to refresh.
(function pullToRefresh() {
  const ind = $("#ptr");
  let y0 = null, pulled = 0;
  window.addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (y0 === null) return;
    pulled = Math.max(0, e.touches[0].clientY - y0);
    ind.style.height = Math.min(pulled * 0.5, 60) + "px";
    ind.classList.toggle("ready", pulled > 110);
  }, { passive: true });
  window.addEventListener("touchend", () => {
    if (y0 !== null && pulled > 110) render({ fresh: true });
    y0 = null;
    ind.style.height = "0";
    ind.classList.remove("ready");
  });
})();

document.querySelectorAll(".tabs button").forEach((b) => {
  b.prepend(icon(b.dataset.tab));
  b.addEventListener("click", () => go(b.dataset.tab));
});
$("#refresh").prepend(icon("refresh"));
$("#refresh").addEventListener("click", () => render({ fresh: true }));
window.addEventListener("popstate", () => { fromHash(); render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("#app").hidden) render(); });

// ---------- login ----------

function showLogin() {
  $("#app").hidden = true;
  $("#login").hidden = false;
  $("#password").focus();
}

$("#login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#login-error").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: { password: $("#password").value } });
    $("#password").value = "";
    start();
  } catch (e) {
    $("#login-error").textContent = e.message;
  }
});

async function start() {
  try {
    me = await api("/api/me");
  } catch (e) {
    if (e.message !== "Please log in") {
      $("#login").hidden = false;
      $("#login-error").textContent = e.message;
    }
    return;
  }
  $("#login").hidden = true;
  $("#app").hidden = false;
  fromHash();
  render();
}

start();

</script>
