<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HQ">
  <meta name="robots" content="noindex, nofollow">
  <title>HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand">HQ</div>
      <p class="muted">Your day, clients and money in one place.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="primary">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <div id="ptr" class="ptr" aria-hidden="true"><span>↓ Pull to refresh</span></div>
    <header class="topbar">
      <h1 id="view-title">Today</h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh"></button>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="calendar">Calendar</button>
      <button data-tab="todos">To-dos</button>
      <button data-tab="clients">Clients<span id="clients-badge" class="badge" hidden></span></button>
      <button data-tab="money">Money</button>
      <button data-tab="ask">Ask</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
